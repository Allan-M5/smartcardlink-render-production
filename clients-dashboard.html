<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SmartCardLink | Client Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔗</text></svg>">
  
    <style>
        :root {
            --primary: #FFD700;
            --text-main: #e2e8f0;
            --bg-dark: #111;
            --card-bg: #1a1a1a;
            --border: #333;
            --success: #38a169;
            --danger: #e53e3e;
            --pending: #d69e2e;
            --processed: #4299e1;
            --deleted: #4a5568;
            --warning: #ed8936; /* For expiry alerts */
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 2rem 1rem;
            color: var(--text-main);
            background: black;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -100;
            filter: brightness(0.4) saturate(1.2);
            object-fit: cover;
        }

        .dashboard-card {
            background-color: var(--bg-dark);
            border-radius: 1rem;
            padding: 2rem;
            width: 100%;
            max-width: 1250px;
            border: 1px solid var(--border);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1.title {
            color: var(--primary);
            font-size: 1.75rem;
            text-align: center;
            margin-bottom: 2rem;
        }

        /* Expiry Highlight Classes */
        .expiry-warning { border-left: 4px solid var(--warning) !important; background-color: rgba(237, 137, 54, 0.05) !important; }
        .expiry-due { border-left: 4px solid var(--danger) !important; background-color: rgba(229, 62, 62, 0.1) !important; }
        .badge-expiry-warning { background: var(--warning); color: #000; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; }
        .badge-expiry-due { background: var(--danger); color: #fff; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 0.7rem; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .controls-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .search-container {
            display: flex;
            gap: 0.5rem;
            flex-grow: 1;
            max-width: 400px;
        }

        input, select, textarea { 
            flex-grow: 1;
            padding: 0.75rem;
            border-radius: 0.375rem;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            transition: border-color 0.3s;
        }

        .button-group { display: flex; gap: 0.5rem; }

        button { 
            padding: 0.75rem 1.2rem;
            border-radius: 0.375rem;
            border: 1px solid var(--primary);
            background-color: var(--card-bg);
            color: var(--primary);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            white-space: nowrap;
        }

        button:hover { background-color: var(--primary); color: #000; }

        .table-container { overflow-x: auto; border-radius: 0.5rem; margin-top: 1rem; }
        table { width: 100%; border-collapse: collapse; min-width: 1000px; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: #222; color: var(--primary); font-size: 0.8rem; text-transform: uppercase; }

        .status-badge {
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }
        .status-Pending { background-color: var(--pending); } 
        .status-Active { background-color: var(--success); } 
        .status-Disabled { background-color: var(--danger); } 

        .client-photo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #444;
        }

        .modal { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); }
        .modal-content {
            background: var(--card-bg);
            margin: 10vh auto;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            border-radius: 0.75rem;
            border: 1px solid var(--border);
            display: flex; flex-direction: column; gap: 1.25rem;
        }

        .toast-container { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 9999; display: flex; flex-direction: column; gap: 0.75rem; }
        .toast { padding: 1rem; border-radius: 0.5rem; color: white; opacity: 0; transform: translateX(50px); transition: 0.3s; }
        .toast.show { opacity: 1; transform: translateX(0); }
        .toast.success { background: #059669; }
        .toast.error { background: #dc2626; }

        .loading-spinner { border: 3px solid #333; border-top: 3px solid var(--primary); border-radius: 50%; width: 24px; height: 24px; animation: spin 0.8s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <video autoplay muted loop playsinline id="bg-video">
        <source src="https://res.cloudinary.com/dicvwaud3/video/upload/v1754439276/oyvgam7oizwizgwxaxge.mp4" type="video/mp4" />
    </video>

    <div class="dashboard-card">
        <h1 class="title">SmartCardLink Client Dashboard</h1>

        <div class="controls-container">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search name, phone, email..." />
                <button id="searchBtn"><i class="fas fa-search"></i></button>
            </div>
            <div class="button-group">
                <select id="statusFilter">
                    <option value="">All Statuses</option>
                    <option value="Active">Active</option>
                    <option value="Disabled">Disabled</option>
                    <option value="Pending">Pending</option>
                </select>
                <button id="exportBtn" title="Export CSV"><i class="fas fa-file-export"></i></button>
                <button id="resetBtn" title="Reset Filters"><i class="fas fa-undo"></i></button>
            </div>
        </div>
        
        <div id="totals" style="text-align: center; color: var(--primary); font-size: 0.9rem; margin-bottom: 1.5rem;"></div>
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Name</th>
                        <th>Company</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Created</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>
        
        <div id="loadingMessage" style="display: none; text-align: center; padding: 3rem;">
            <div class="loading-spinner" style="margin: 0 auto 1rem;"></div>
            <p>Syncing with database...</p>
        </div>
        <div id="noResults" style="display: none; text-align: center; padding: 3rem; color: #666;">No records found.</div>
    </div>
  
    <div id="notesModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle" style="margin: 0; font-size: 1.25rem; color: var(--primary);">Reason for Action</h2>
            <textarea id="modalTextarea" placeholder="Provide audit reason..."></textarea>
            <div style="display: flex; gap: 0.5rem;">
                <button id="modalConfirmBtn" style="flex: 2; background: var(--primary); color: #000;">Confirm</button>
                <button id="modalCloseBtn" style="flex: 1; border-color: #555;">Cancel</button>
            </div>
        </div>
    </div>
  
    <div class="toast-container" id="toast-container"></div>

    <script>
        const API_BASE_URL = "https://smartcardlink-api.onrender.com"; 
        let allClientData = [];

        const elements = {
            table: document.getElementById('clientTableBody'),
            search: document.getElementById('searchInput'),
            filter: document.getElementById('statusFilter'),
            loader: document.getElementById('loadingMessage'),
            empty: document.getElementById('noResults'),
            totals: document.getElementById('totals'),
            modal: document.getElementById('notesModal'),
            modalText: document.getElementById('modalTextarea'),
            modalConfirm: document.getElementById('modalConfirmBtn'),
            toastBox: document.getElementById('toast-container')
        };

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerText = msg;
            elements.toastBox.prepend(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 300); }, 5000);
        }

        const calculateMonths = (date) => {
            if (!date) return null;
            const d = new Date(date), n = new Date();
            let m = (n.getFullYear() - d.getFullYear()) * 12 + (n.getMonth() - d.getMonth());
            return Math.max(0, m);
        };

        async function fetchClients() {
            elements.loader.style.display = 'block';
            elements.table.innerHTML = '';
            try {
                const res = await fetch(`${API_BASE_URL}/api/clients/all`);
                const result = await res.json();
                allClientData = result.data || [];
                render();
            } catch (err) {
                showToast("Database Connection Failed", 'error');
            } finally {
                elements.loader.style.display = 'none';
            }
        }

        function render() {
            const search = elements.search.value.toLowerCase();
            const filter = elements.filter.value;

            const filtered = allClientData.filter(c => {
                const matchStr = `${c.fullName} ${c.email1} ${c.phone1} ${c.company}`.toLowerCase();
                return matchStr.includes(search) && (!filter || c.status === filter);
            });

            elements.empty.style.display = filtered.length ? 'none' : 'block';
            
            elements.table.innerHTML = filtered.map(c => {
                const dateSource = c.vcardCreatedDate || c.createdAt;
                const months = calculateMonths(dateSource);
                
                let rowClass = "";
                let alertBadge = "";

                if (months !== null) {
                    if (months >= 12) {
                        rowClass = "expiry-due";
                        alertBadge = `<br><span class="badge-expiry-due">RENEWAL DUE</span>`;
                    } else if (months >= 11) {
                        rowClass = "expiry-warning";
                        alertBadge = `<br><span class="badge-expiry-warning">EXPIRING SOON</span>`;
                    }
                }

                return `
                <tr class="${rowClass}">
                    <td><img src="${c.photoUrl || 'https://placehold.co/50x50/222/fff?text=?'}" class="client-photo" onerror="this.src='https://placehold.co/50x50/222/fff?text=?'"></td>
                    <td style="font-weight:700">${c.fullName || '-'}</td>
                    <td>${c.company || '-'}</td>
                    <td>${c.email1 || '-'}</td>
                    <td>${c.phone1 || '-'}</td>
                    <td>${dateSource ? dateSource.split('T')[0] : '-'}</td>
                    <td><strong>${months !== null ? months + ' months' : 'N/A'}</strong>${alertBadge}</td>
                    <td><span class="status-badge status-${c.status || 'Pending'}">${c.status || 'Pending'}</span></td>
                    <td>
                        <button onclick="openActionModal('${c._id}', '${c.status === 'Active' ? 'Disabled' : 'Active'}')" title="Toggle Status">
                            <i class="fas ${c.status === 'Active' ? 'fa-ban' : 'fa-check'}"></i>
                        </button>
                    </td>
                </tr>`;
            }).join('');

            elements.totals.innerHTML = `Total Clients: ${filtered.length} | Active Subscriptions: ${filtered.filter(x=>x.status==='Active').length}`;
        }

        window.openActionModal = (id, nextStatus) => {
            elements.modal.style.display = 'block';
            elements.modalConfirm.onclick = async () => {
                const note = elements.modalText.value.trim();
                if (!note) return showToast('Reason required', 'error');
                
                try {
                    const res = await fetch(`${API_BASE_URL}/api/clients/${id}/status/${nextStatus}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ notes: note })
                    });
                    if (res.ok) {
                        showToast("Client Status Updated");
                        elements.modal.style.display = 'none';
                        fetchClients();
                    }
                } catch (err) { showToast("Update Failed", 'error'); }
            };
        };

        document.getElementById('exportBtn').onclick = () => {
            const csv = allClientData.map(c => `"${c.fullName}","${c.email1}","${c.status}"`).join("\n");
            const blob = new Blob(["Name,Email,Status\n" + csv], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "clients_report.csv";
            a.click();
        };

        document.getElementById('resetBtn').onclick = () => { elements.search.value = ''; elements.filter.value = ''; render(); };
        document.getElementById('modalCloseBtn').onclick = () => elements.modal.style.display = 'none';
        elements.search.oninput = render;
        elements.filter.onchange = render;

        fetchClients();
    </script>
</body>
</html>
